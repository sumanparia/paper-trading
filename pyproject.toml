[project]
name = "trade-api"
version = "0.1.0"
description = "Groww-like Trade API Server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "yfinance>=0.2.36",
    "finnhub-python>=2.4.19",
    "httpx>=0.27.0",
    "markdown>=3.10.2",
    "sqlalchemy>=2.0.51",
    "aiosqlite>=0.22.1",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
]
